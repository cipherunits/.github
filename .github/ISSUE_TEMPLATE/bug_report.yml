name: Bug report
description: Report something that isn't working as expected
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Fill out the sections below so we can triage quickly.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear, concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps that trigger the issue.
      placeholder: |
        1. Go to '...'
        2. Run '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Screenshots / logs
      description: If applicable, add screenshots or paste relevant log/error output.
      render: shell

  - type: input
    id: repo
    attributes:
      label: Repository & version/commit
      placeholder: e.g. CipherToken @ abc1234
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: e.g. Ubuntu 24.04, macOS 15, Windows 11

  - type: input
    id: runtime
    attributes:
      label: Runtime version
      description: Node, Rust, Python, or other runtime — if relevant.
      placeholder: e.g. Node 22, Rust 1.85

  - type: input
    id: browser
    attributes:
      label: Browser
      description: Only if this is a UI / web issue.
      placeholder: e.g. Firefox 136

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might help us diagnose the issue.
